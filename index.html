<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duke Vytis and the Quest for New Lands</title>
<!-- Saved to a phone's home screen (Safari: Share, Add to Home Screen; Chrome: Install app), the
     page opens as an app of its own: full screen, no browser bars. That is how an iPhone plays,
     from the GitHub Pages copy. The desktop build and the Android app ignore all of it. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05030a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duke Vytis">
<link rel="apple-touch-icon" href="assets/icon.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05030a;
    overflow: hidden;
    /* A pointer sitting over a pixel-art game is just clutter. */
    cursor: none;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #screen {
    /* The canvas backing store is 1920x1080 (VW*PX by VH*PX); the renderer sets both
       the backing store and the CSS size, so the width/height attributes below are only
       what a reader sees first. These three properties are what stop the browser from
       smoothing the upscale into mush -- without them a 4K display interpolates every
       one of the 2x2 blocks a backing-store pixel becomes (4x4 on the old 960x540 store)
       and the whole point of the pixel art is lost. */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
    display: block;
    background: #000;
    /* Hint the compositor to keep this on its own layer, so the scale is a GPU
       blit rather than a per-frame CPU resample. */
    will-change: transform;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
    justify-content: center;
    color: #e8c870;
    font: 700 16px/1.6 ui-monospace, Consolas, monospace;
    letter-spacing: 2px;
    background: #05030a;
    text-align: center;
    white-space: pre;
  }
  /* The game's own icon over the loader's line, as the Android app's loading screen shows it. */
  #boot img { width: 112px; height: 112px; image-rendering: pixelated; }
  /* The two things a page embedded in another site (itch.io) has to say for itself; see
     src/core/embed.js, which shows and hides them. Pointer events pass through, so the
     click that answers the focus banner lands on the canvas and takes the keyboard. */
  #focus-hint, #saves-off {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 14px;
    font: 13px/1.5 ui-monospace, Consolas, monospace;
    text-align: center;
    background: #05030ae0;
    border: 1px solid #2e2444;
    pointer-events: none;
    z-index: 2;
  }
  /* A phone held upright: the game is played sideways, and upright its 16:9 frame is a strip
     across the middle of the screen (an iPhone in Safari opens that way). Said, over the game,
     until the phone is turned; main.js pauses a run it finds upright. The Android app is held
     sideways by the system and never shows it. */
  #rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: #05030a;
    color: #e8c870;
    font: 700 20px/1.5 ui-monospace, Consolas, monospace;
    text-align: center;
    letter-spacing: 2px;
  }
  #rotate .phone {
    width: 64px;
    height: 108px;
    border: 5px solid #e8c870;
    border-radius: 12px;
    animation: turn 2.4s ease-in-out infinite;
  }
  @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  #focus-hint { top: 10px; color: #ffe23d; }
  #saves-off { bottom: 10px; color: #9aa0bb; max-width: 90%; }
  #focus-hint[hidden], #saves-off[hidden] { display: none; }
</style>
</head>
<body>
  <div id="wrap"><canvas id="screen" width="1920" height="1080"></canvas></div>
  <div id="boot"><img src="assets/icon.png" alt=""><span>LOADING DUKE VYTIS...</span></div>
  <div id="rotate"><div class="phone"></div><div>TURN YOUR PHONE<br>SIDEWAYS</div></div>
  <div id="focus-hint" hidden>CLICK THE GAME TO PLAY -- IT DOES NOT HAVE THE KEYBOARD</div>
  <div id="saves-off" hidden>SAVES ARE OFF: THIS BROWSER BLOCKS STORAGE FOR A GAME INSIDE ANOTHER SITE, SO SCORES AND SETTINGS LAST ONLY UNTIL THE PAGE CLOSES</div>

  <script type="module">
    // ES modules over file:// are blocked by CORS, and that failure is silent enough
    // that the page just looks broken. Say so plainly instead.
    if (location.protocol === 'file:') {
      document.getElementById('boot').textContent =
        'This build uses ES modules, which browsers refuse to load from file://.\n\n' +
        'Run  play.bat  (or  npm run serve  ) and open the address it prints.';
    } else {
      // The game is imported only once the LOADING line has been painted. Its modules evaluate
      // as one long task -- the painting ahead included -- and a page gets no chance to paint in
      // one: on a slow phone (the Android emulator: 22 s) the screen stayed BLACK for all of it,
      // which reads as broken. A frame, then the import; and a timer as well, because some
      // pages never fire requestAnimationFrame (an offscreen or hidden window).
      let started = false;
      const start = () => {
        if (started) return;
        started = true;
        import('./src/main.js')
          // The loader goes when the game's first frames are on the screen (main.js onScreen).
          .then(() => {})
          .catch((err) => {
            document.getElementById('boot').textContent = 'FAILED TO START\n\n' + err;
            console.error(err);
          });
      };
      requestAnimationFrame(() => setTimeout(start, 0));
      setTimeout(start, 100);
    }
  </script>
</body>
</html>
